name: Build Windows app

on:
  push:
    branches:
      - production-local-workflow
      - version-1.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test version 1.1 workflow
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Smoke-test imports
        run: python -c "import app; from modules.excel_loader import load_students; from modules.photo_sorter import sort_photos; print('imports ok')"

      - name: Build Windows application
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name NEA-Toolbox
          --collect-all cv2
          --collect-all qrcode
          --collect-all pandas
          --collect-all pypdfium2
          --collect-all pypdfium2_raw
          app.py

      - name: Verify packaged PDF engine
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/NEA-Toolbox/NEA-Toolbox.exe" -ArgumentList "--self-test-pdf" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged PDF engine failed" }

      - name: Add read-me to Windows package
        shell: pwsh
        run: |
          @"
          NEA Toolbox
          ===========
          Double-click NEA-Toolbox.exe.

          Keep the _internal folder beside the EXE.
          Load the real Excel dashboard locally; do not place it in GitHub.
          Test with the private sample pack before using live pupil photographs.
          "@ | Set-Content -Path "dist/NEA-Toolbox/README-FIRST.txt"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NEA-Toolbox-1.1.1-Windows
          path: dist/NEA-Toolbox/
          if-no-files-found: error
          retention-days: 14
